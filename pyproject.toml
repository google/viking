[project]
name = "viking-jax"
version = "0.1.0"
description = "JAX/Flax implementation of the Viking low-latency speech enhancement and hearing-aid model."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Shaikat Hossain" },
    { name = "Tomo Akitomi" },
    { name = "Oscar Wahltinez" },
]
dependencies = [
    "flax>=0.12.12",
    "jax>=0.12.0.1",
    "jaxlib>=0.12.0.1",
]

[dependency-groups]
dev = [
    "absl-py>=2.5.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viking_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PLC", "PLE", "PLW", "RUF100"]
ignore = ["PLW0603", "PLW0120"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
force-single-line = true
